<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Challenge</title>
</head>
<body>
    <h1>User Registration Form</h1>
    <form>
    First Name: <input type="text" name="firstname">
       <br><br>
       Last Name: <input type="text" name="lastname">
       <br><br>
       Password:  <input type="password" name="password">
       <br><br>
       Bio: <textarea name="bio" rows="4" cols="40" ></textarea>
       <br>
       <br><br>
       <fieldset>
        <legend>Gender:</legend>
        <input type="radio" name="gender" value="male">Male <br>
        <input type="radio" name="gender" value="female">Female<br>
        <input type="radio" name="gender" value="others">Others<br>
       </fieldset>
       <br>
       <fieldset>
        <legend>Interests:</legend>
        <input type="checkbox" name="interest" value="music">Music<br>
        <input type="checkbox" name="interest" value="sports">Sports<br>
        <input type="checkbox" name="interest" value="reading">Reading<br>
       </fieldset>
       <br>
       Country:
       <select name="country">
        <option value="us">United States</option>
        <option value="uk">United kingdom</option>
        <option value="in">India</option>
        <option value="pak">Pakistan</option>
        <option value="other">Other</option>
       </select>
       <br><br>
        <label for="colors">Preferred Colors:</label>
       <br>
       <select id="colors" name="colors" multiple size="4">
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="yellow">Yellow</option>
       </select>
       <br><br>
       <label for="profile">Profile Picture:</label>
       <input type="file" id="profile" name="profile">
       <br><br>
       <label for="birthdate">Birthdate:</label>
       <input type="date" id="birthdate" name="birthdate">
       <br><br>
       <label for="email">Email:</label>
       <input type="email" id="email" name="email">
       <br><br>
       <label for="website">Website:</label>
       <input type="url" id="website" name="website">
       <br><br>
       <label for="search">Search:</label>
       <input type="search" id="search" name="search">
       <br><br>
       <input type="submit" value="submit">
    </form>
</body>
</html>
